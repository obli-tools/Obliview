<!DOCTYPE html>
<html lang="en" class="dark" data-theme="obli-operator">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile: viewport-fit=cover exposes the
         safe-area insets (--safe-* in index.css); resizes-content makes the
         soft keyboard shrink the layout viewport so dvh-sized sheets stay
         above it. Pinch zoom is intentionally kept (no maximum-scale). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Browser / PWA chrome tint = Obli Operator header colour (#131728). -->
    <meta name="theme-color" content="#131728" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Obli Design v1 typography — sans: Inter (body, UI chrome),
         display: Rajdhani (page titles + hero KPI values, opt-in via
         font-display class), mono: JetBrains Mono (IDs / counts / dates). -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- FOUC prevention — read the persisted theme BEFORE React boots so the
         page doesn't briefly render in the wrong theme on reload. Must stay
         in sync with utils/theme.ts KNOWN_THEMES + STORAGE_KEY. -->
    <script>
      try {
        var t = localStorage.getItem('ov-theme');
        if (t === 'obli-operator' || t === 'obli-daylight' || t === 'obli-dim' || t === 'modern' || t === 'neon') {
          document.documentElement.dataset.theme = t;
        } else {
          document.documentElement.dataset.theme = 'obli-operator';
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'obli-operator';
      }
    </script>
    <!-- Pre-Tailwind body backgrounds so the flash before CSS loads matches
         the saved theme instead of always defaulting to dark. -->
    <style>
      [data-theme="obli-daylight"] body { background: #e5e9f0; }
      [data-theme="obli-dim"] body { background: #2e3440; }
    </style>
    <title>Obliview</title>
  </head>
  <body class="bg-bg-primary text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
